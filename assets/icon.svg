<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- After setting viewBox = "0 0 100 100" all coordinates becomes relative to it -->
    <circle cx="50" cy="50" r="50" stroke="white" stroke-width="0.1" fill="black"/>
    <circle cx="50" cy="10" r="10" stroke="yellow" stroke-width="0.1" fill="lightblue"/>
    <circle cx="50" cy="90" r="10" stroke="yellow" stroke-width="0.1" fill="lightblue"/>
    <rect x="0" y="40" width="20" height="20" stroke="yellow" stroke-width="0.1" fill="lightgreen"/>
    <rect x="80" y="40" width="20" height="20" stroke="yellow" stroke-width="0.1" fill="lightgreen"/>
    <defs>
        <marker id="arrowhead1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="violet"/>
        </marker>
        <marker id="arrowhead2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="lightyellow"/>
        </marker> 
    </defs>
    <line x1="50" y1="10" x2="10" y2="50" stroke="violet" stroke-width="2" marker-end="url(#arrowhead1)"/>
    <line x1="50" y1="90" x2="90" y2="50" stroke="violet" stroke-width="2" marker-end="url(#arrowhead1)"/>
    <line x1="10" y1="50" x2="50" y2="90" stroke="lightyellow" stroke-width="2" marker-end="url(#arrowhead2)"/>
    <line x1="90" y1="50" x2="50" y2="10" stroke="lightyellow" stroke-width="2" marker-end="url(#arrowhead2)" />  
</svg>